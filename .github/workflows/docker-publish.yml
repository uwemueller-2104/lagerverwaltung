name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Trigger bei jedem Push auf den Hauptbranch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Code aus dem GitHub-Repository auschecken
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Am Docker Hub Account anmelden
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Docker Buildx einrichten (für optimiertes Bauen)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Image bauen und zu Docker Hub pushen
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # Ersetzen Sie den Namen mit Ihrem Docker-Hub-Namen und Wunschnamen:
        tags: bigphootum/lagerverwaltung:latest, ${{ github.sha }}

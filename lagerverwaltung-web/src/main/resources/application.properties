spring.application.name=lagersoftware

# H2 als lokale Datei-Datenbank (kein separater Datenbankserver noetig)
spring.datasource.url=jdbc:h2:file:./data/lagersoftware;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2-Konsole zum Reinschauen in die Datenbank waehrend der Entwicklung
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

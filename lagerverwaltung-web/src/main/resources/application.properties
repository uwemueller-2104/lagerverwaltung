spring.application.name=lagersoftware

# H2 als lokale Datei-Datenbank (kein separater Datenbankserver noetig)
spring.datasource.url=jdbc:h2:file:./data/lagersoftware;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema wird jetzt per Flyway verwaltet (siehe
# src/main/resources/db/migration/). Hibernate darf das Schema nur noch
# gegen die Entities validieren, nicht mehr selbst aendern.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway ist automatisch aktiv, sobald flyway-core auf dem Klassenpfad ist,
# und migriert bei jedem Start automatisch gegen dieselbe Datenquelle oben.
# Migrationen liegen unter src/main/resources/db/migration/V<n>__name.sql.

# H2-Konsole zum Reinschauen in die Datenbank waehrend der Entwicklung
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# HTTPS fuer den Kamera-/Barcode-Scan vom Handy: Browser verweigern
# Kamerazugriff (getUserMedia) ausserhalb von https oder localhost.
# Zertifikat erst selbst erzeugen (siehe README), dann diese Zeilen
# einkommentieren und server.port=8080 oben entfernen bzw. auskommentieren:
#
# server.port=8443
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=lagersoftware
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=lagersoftware

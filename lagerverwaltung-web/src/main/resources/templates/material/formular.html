<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Material anlegen/bearbeiten</title>
</head>
<body>
    <h1 th:text="${material.id} != null ? 'Material bearbeiten' : 'Neues Material'">Material</h1>

    <form th:action="@{/material/speichern}" th:object="${material}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Name</label><br/>
            <input type="text" th:field="*{name}" required />
        </div>
        <div>
            <label>Einheit</label><br/>
            <input type="text" th:field="*{einheit}" placeholder="z.B. Stk, m, m²" required />
        </div>
        <div>
            <label>Mindestbestand</label><br/>
            <input type="number" step="0.01" th:field="*{mindestbestand}" />
        </div>
        <div>
            <label>Barcode</label><br/>
            <input type="text" th:field="*{barcode}" />
        </div>

        <p>
            <button type="submit">Speichern</button>
            <a th:href="@{/material}">Abbrechen</a>
        </p>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Material anlegen/bearbeiten</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav('material')}"></div>
    <main class="inhalt">
        <h1 th:text="${material.id} != null ? 'Material bearbeiten' : 'Neues Material'">Material</h1>

        <form class="formular" th:action="@{/material/speichern}" th:object="${material}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="feld">
                <label>Name</label>
                <input type="text" th:field="*{name}" required />
            </div>
            <div class="feld">
                <label>Einheit</label>
                <input type="text" th:field="*{einheit}" placeholder="z.B. Stk, m, m²" required />
            </div>
            <div class="feld">
                <label>Mindestbestand</label>
                <input type="number" step="0.01" th:field="*{mindestbestand}" />
            </div>
            <div class="feld">
                <label>Barcode</label>
                <input type="text" th:field="*{barcode}" />
            </div>

            <div class="aktionsleiste">
                <button type="submit" class="btn">Speichern</button>
                <a class="btn text" th:href="@{/material}">Abbrechen</a>
            </div>
        </form>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Neue Buchung</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav('buchung')}"></div>
    <main class="inhalt">
        <h1>Neue Buchung</h1>
        <p class="hinweis">Gebucht als <strong sec:authentication="name">Benutzer</strong>.</p>

        <p th:if="${fehler}" th:text="${fehler}" class="meldung-fehler"></p>

        <form class="formular" th:action="@{/buchung/buchen}" method="post">
            <div class="feld">
                <label>Typ</label>
                <select name="typ" required>
                    <option th:each="t : ${typOptionen}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="feld">
                <label>Material</label>
                <select name="materialId" required>
                    <option th:each="m : ${materialOptionen}" th:value="${m.id}" th:text="${m.name}"></option>
                </select>
            </div>
            <div class="feld">
                <label>Lagerplatz</label>
                <select name="lagerplatzId" required>
                    <option th:each="lp : ${lagerplatzOptionen}" th:value="${lp.id}"
                            th:text="${lp.lager.name} + ' – ' + ${lp.bezeichnung}"></option>
                </select>
            </div>
            <div class="feld">
                <label>Menge</label>
                <input type="number" step="0.01" name="menge" required />
            </div>

            <div class="aktionsleiste">
                <button type="submit" class="btn">Buchen</button>
                <a class="btn text" th:href="@{/buchung}">Abbrechen</a>
            </div>
        </form>
    </main>
</body>
</html>

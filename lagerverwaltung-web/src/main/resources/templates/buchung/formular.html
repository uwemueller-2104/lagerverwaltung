<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neue Buchung</title>
</head>
<body>
    <h1>Neue Buchung</h1>

    <p th:if="${fehler}" th:text="${fehler}" style="color:#8A5A17;background:#F4E3C9;padding:8px;"></p>

    <form th:action="@{/buchung/buchen}" method="post">
        <div>
            <label>Typ</label><br/>
            <select name="typ" required>
                <option th:each="t : ${typOptionen}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div>
            <label>Material</label><br/>
            <select name="materialId" required>
                <option th:each="m : ${materialOptionen}" th:value="${m.id}" th:text="${m.name}"></option>
            </select>
        </div>
        <div>
            <label>Lagerplatz</label><br/>
            <select name="lagerplatzId" required>
                <option th:each="lp : ${lagerplatzOptionen}" th:value="${lp.id}"
                        th:text="${lp.lager.name} + ' – ' + ${lp.bezeichnung}"></option>
            </select>
        </div>
        <div>
            <label>Benutzer</label><br/>
            <select name="benutzerId" required>
                <option th:each="b : ${benutzerOptionen}" th:value="${b.id}" th:text="${b.anzeigename}"></option>
            </select>
        </div>
        <div>
            <label>Menge</label><br/>
            <input type="number" step="0.01" name="menge" required />
        </div>

        <p>
            <button type="submit">Buchen</button>
            <a th:href="@{/buchung}">Abbrechen</a>
        </p>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bestand anlegen/korrigieren</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav('bestand')}"></div>
    <main class="inhalt">
        <h1 th:text="${bestand.id} != null ? 'Bestand korrigieren' : 'Bestand direkt anlegen'">Bestand</h1>

        <form class="formular" th:action="@{/bestand/speichern}" th:object="${bestand}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="feld">
                <label>Material</label>
                <select name="materialId" required>
                    <option th:each="m : ${materialOptionen}"
                            th:value="${m.id}"
                            th:text="${m.name}"
                            th:selected="${bestand.material != null and bestand.material.id == m.id}">
                    </option>
                </select>
            </div>
            <div class="feld">
                <label>Lagerplatz</label>
                <select name="lagerplatzId" required>
                    <option th:each="lp : ${lagerplatzOptionen}"
                            th:value="${lp.id}"
                            th:text="${lp.lager.name} + ' – ' + ${lp.bezeichnung}"
                            th:selected="${bestand.lagerplatz != null and bestand.lagerplatz.id == lp.id}">
                    </option>
                </select>
            </div>
            <div class="feld">
                <label>Menge</label>
                <input type="number" step="0.01" th:field="*{menge}" required />
            </div>

            <div class="aktionsleiste">
                <button type="submit" class="btn">Speichern</button>
                <a class="btn text" th:href="@{/bestand}">Abbrechen</a>
            </div>
        </form>
    </main>
</body>
</html>

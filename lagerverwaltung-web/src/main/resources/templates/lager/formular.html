<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lager anlegen/bearbeiten</title>
</head>
<body>
    <h1 th:text="${lager.id} != null ? 'Lager bearbeiten' : 'Neues Lager'">Lager</h1>

    <form th:action="@{/lager/speichern}" th:object="${lager}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Name</label><br/>
            <input type="text" th:field="*{name}" required />
        </div>
        <div>
            <label>Ort</label><br/>
            <input type="text" th:field="*{ort}" />
        </div>

        <p>
            <button type="submit">Speichern</button>
            <a th:href="@{/lager}">Abbrechen</a>
        </p>
    </form>
</body>
</html>

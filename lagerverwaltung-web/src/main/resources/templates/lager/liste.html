<title>Lager verwalten</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
 </head>
 <body>
    <div th:replace="~{fragments/nav :: nav('lager')}"></div>
    <main class="inhalt">
        <h1>Lager</h1>
        <table class="tabelle">
            <tr th:each="lager : ${lagerListe}">
                <td th:text="${lager.name}">Name</td>
                <td th:text="${lager.ort}">Ort</td>
            </tr>
        </table>
        <a th:href="...">Bearbeiten</a>
        <div class="aktionsleiste">
            <a class="btn" th:href="@{/lager/neu}">+ Neues Lager anlegen</a>
        </div>
    </main>
